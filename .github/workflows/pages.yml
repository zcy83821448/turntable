# Publishes the page to GitHub Pages.
#
# Only what a browser actually asks for is uploaded: index.html, styles.css and
# the built bundle. The sources, node_modules and the notes are not part of the
# site — and neither is assets/, because the model travels *inside* dist/app.js.
#
# `enablement: true` lets this turn Pages on by itself the first time it runs, so
# nothing has to be clicked in Settings. If the repository's Pages source is set
# to "Deploy from a branch" instead, this workflow is simply ignored and the
# branch is served.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: stage the site
        run: |
          mkdir -p _site
          cp index.html styles.css _site/
          cp -r dist _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
